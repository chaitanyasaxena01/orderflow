# Optional local stack. OrderFlow also runs without Docker if you provide
# DATABASE_URL and REDIS_URL (local installs, Neon, or Upstash).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow
      POSTGRES_DB: orderflow
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U orderflow -d orderflow']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['node', 'apps/api/dist/server.js']
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://orderflow:orderflow@postgres:5432/orderflow?schema=public
      DIRECT_URL: postgresql://orderflow:orderflow@postgres:5432/orderflow?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 4000
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/health']
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['node', 'apps/api/dist/worker.js']
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://orderflow:orderflow@postgres:5432/orderflow?schema=public
      DIRECT_URL: postgresql://orderflow:orderflow@postgres:5432/orderflow?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_URL: http://localhost:4000
    ports:
      - '5173:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
